name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Same compose.yaml used locally — MySQL/Redis/MailHog, ports auto-assigned and
      # auto-discovered by Spring Boot's service-connection support.
      - name: Start local infra
        run: docker compose up -d

      - name: Run tests
        run: ./mvnw -B test
