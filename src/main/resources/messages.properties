# Centralized user-facing error text (Spanish). Keyed by the errorCode every exception already
# carries as a stable frontend-facing key — see GlobalExceptionHandler for how this is resolved.
# {0}, {1}, ... are MessageFormat placeholders filled in from the exception's args.

# --- Auth ---
INVALID_CREDENTIALS=Credenciales inválidas.
ACCOUNT_LOCKED=Cuenta bloqueada temporalmente por demasiados intentos fallidos.
ACCOUNT_DISABLED=Esta cuenta está deshabilitada.
EMAIL_NOT_VERIFIED=Debes verificar tu correo antes de iniciar sesión.
EMAIL_ALREADY_EXISTS=Ya existe una cuenta con ese correo.
INVALID_TOKEN=El token es inválido o ha expirado.
INVALID_INVITATION=La invitación es inválida, ya fue usada o ha expirado.
INVALID_PROVIDER=Proveedor de autenticación no soportado para esta operación.
USER_NOT_FOUND=Usuario no encontrado.
USER_NOT_REGISTERED=El correo debe pertenecer a un usuario ya registrado en el sistema para poder invitarlo.
USER_NOT_VERIFIED=El usuario debe verificar su correo antes de poder ser invitado como administrador.
INVITATION_ALREADY_PENDING=Ya existe una invitación pendiente para este correo. Reenvíala o cancélala antes de crear una nueva.
INVITATION_NOT_PENDING=Esta invitación ya fue resuelta y no puede modificarse.
INVITATION_EMAIL_MISMATCH=Esta invitación no corresponde a tu cuenta.
USER_ALREADY_ADMIN=Este usuario ya tiene rol de administrador.

# --- Notification ---
NOTIFICATION_NOT_FOUND=Notificación no encontrada.

# --- Order ---
ORDER_NOT_FOUND=Pedido no encontrado.

# --- Address ---
SHIPPING_ADDRESS_NOT_FOUND=Dirección de envío no encontrada.

# --- Review ---
REVIEW_NOT_FOUND=Reseña no encontrada.
REVIEW_ALREADY_EXISTS=Ya reseñaste este ítem. Edita tu reseña existente en vez de crear una nueva.

# --- Refund ---
REFUND_NOT_FOUND=Reembolso no encontrado.
ORDER_NOT_REFUNDABLE=Este pedido no admite reembolsos en su estado actual.
REFUND_LINE_NOT_IN_ORDER=Una de las líneas indicadas no pertenece a este pedido.
REFUND_QUANTITY_EXCEEDS_ORDER_LINE=La cantidad a reembolsar excede lo comprado en esa línea.
REFUND_LINE_ALREADY_REFUNDED=Una de las líneas ya está cubierta por otro reembolso en curso o completado.
REFUND_INVALID_STATUS_TRANSITION=Este reembolso no puede pasar a ese estado desde su estado actual.

# --- Framework exceptions handled directly in GlobalExceptionHandler ---
VALIDATION_ERROR=La solicitud contiene errores de validación.
ACCESS_DENIED=No tienes permisos para realizar esta acción.
DATA_CONFLICT=Ya existe un registro con esos datos.
INTERNAL_ERROR=Ocurrió un error inesperado.

# --- Catalog (Item/Category/Brand) ---
CATEGORY_NOT_FOUND=Categoría no encontrada.
BRAND_NOT_FOUND=Marca no encontrada.
ITEM_NOT_FOUND=Ítem no encontrado.
VARIANT_NOT_FOUND=Variante no encontrada.
CATEGORY_INACTIVE=La categoría seleccionada está inactiva.
BRAND_INACTIVE=La marca seleccionada está inactiva.
PRICE_OUT_OF_RANGE=El precio de {0} debe estar entre {1} y {2} según los límites de la categoría.
CATEGORY_IN_USE=No se puede desactivar la categoría {0} porque tiene ítems activos asociados. Reasígnalos antes de continuar.
BRAND_IN_USE=No se puede desactivar la marca {0} porque tiene ítems activos asociados. Reasígnalos antes de continuar.

# --- Discount ---
DISCOUNT_NOT_FOUND=Descuento no encontrado.
DISCOUNT_CODE_ALREADY_IN_USE=El código {0} ya está en uso por otro descuento.
DISCOUNT_INVALID_TARGETING=Debes indicar exactamente una opción de segmentación\: todo el catálogo, categorías, ítems o variantes.
DISCOUNT_INVALID_EXCLUSION=No se pueden excluir variantes cuando la segmentación ya es por variante específica.
DISCOUNT_INVALID_DATE_RANGE=La fecha de fin debe ser posterior a la fecha de inicio.
DISCOUNT_CODE_INVALID=El código de descuento no es válido.
DISCOUNT_MIN_PURCHASE_NOT_MET=Este descuento requiere una compra mínima de {0}.
DISCOUNT_USAGE_LIMIT_REACHED=Este descuento alcanzó su límite de usos.
DISCOUNT_NOT_APPLICABLE=Este descuento no aplica a los productos de tu carrito.

# --- Cart ---
CART_NOT_FOUND=Carrito no encontrado.
VARIANT_INACTIVE=Esta variante ya no está disponible.
INSUFFICIENT_STOCK=No hay suficiente stock de {0}. Disponible\: {1}.

# --- Checkout ---
CART_NOT_ACTIVE=Este carrito ya no está activo.
EMPTY_CART=El carrito está vacío.
OUT_OF_STOCK=No hay stock suficiente de {0} para completar la compra.
PAYMENT_DECLINED=El pago fue rechazado\: {0}.
UNSUPPORTED_PAYMENT_TYPE=Tipo de pago no soportado.
IDEMPOTENCY_KEY_REUSED=Esta clave de idempotencia ya fue usada para un intento de pago distinto.
